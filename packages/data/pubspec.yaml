name: data
publish_to: 'none'

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../domain
  cloud_firestore: ^5.6.7
  firebase_analytics: ^11.4.5
  firebase_auth: ^5.5.3
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5
  firebase_remote_config: ^5.4.3
  flutter_app_badge_control: ^0.0.2
  flutter_cache_manager: ^3.4.1
  geolocator: ^14.0.0
  hooks_riverpod: ^2.6.1
  http: ^1.4.0
  intl: ^0.20.2
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  streaming_shared_preferences: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.15
  mocktail: ^1.0.4
  # SharedPreferences を使う Repository のテストで、初期値を差し込むのに使う。
  shared_preferences: ^2.5.5
  flutter_lints: ^5.0.0
  # Flutter に依存するパッケージ（Firebase など）を使うので、flutter_test でテストを書く。
  flutter_test:
    sdk: flutter
